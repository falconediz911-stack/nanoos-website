<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · NanoOS</title>
    <style>
      :root {
        --bg: #050912;
        --text: #f3f8ff;
        --muted: #a6b5c9;
        --border: rgba(143, 203, 255, 0.18);
        --accent: linear-gradient(135deg, #a9d8ff 0%, #6fe3ef 60%, #4fcadb 100%);
        --accent-fg: #03121c;
        --glow: rgba(111, 227, 239, 0.15);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef3f9;
          --text: #0a1626;
          --muted: #3e5068;
          --border: rgba(18, 58, 110, 0.16);
          --accent: linear-gradient(135deg, #2b7fe0 0%, #0c9db0 100%);
          --accent-fg: #ffffff;
          --glow: rgba(8, 160, 180, 0.13);
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: radial-gradient(900px 560px at 80% -10%, var(--glow), transparent 62%), var(--bg);
        color: var(--text);
        font-family: Inter, 'Noto Sans', system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 520px; }
      img { width: 64px; height: 64px; }
      .code { margin-top: 26px; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.14em; }
      h1 { margin-top: 10px; font-size: clamp(34px, 7vw, 52px); letter-spacing: -0.04em; line-height: 1.05; }
      p { margin-top: 16px; color: var(--muted); line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 13px 22px;
        border-radius: 14px;
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="NanoOS" />
      <div class="code">404</div>
      <h1>This page isn't here.</h1>
      <p>The link may be old. Everything about NanoOS, including the download, is on the home page.</p>
      <a href="/">Back to NanoOS</a>
    </main>
  </body>
</html>
