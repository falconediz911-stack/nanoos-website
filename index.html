<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NanoOS</title>
    <meta
      name="description"
      content="NanoOS Gaming: an Arch Linux based gaming distribution with KDE Plasma, the NanoSched kernel, NVIDIA and AMD drivers, Steam and signed pacman updates."
    />
    <link rel="canonical" href="https://nanoosproject.org/" />
    <meta name="theme-color" content="#050912" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef3f9" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NanoOS" />
    <meta property="og:title" content="NanoOS: Your Linux, Refined." />
    <meta
      property="og:description"
      content="NanoOS Gaming is out: Arch Linux based, KDE Plasma, NanoSched kernel, NVIDIA and AMD drivers, Steam and signed updates."
    />
    <meta property="og:url" content="https://nanoosproject.org/" />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap"
    />
    <script>
      // Resolve the theme before the first paint (no light/dark flash).
      ;(function () {
        var t = 'system'
        try { t = localStorage.getItem('nanoos-theme') || 'system' } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
