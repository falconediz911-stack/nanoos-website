name: Update NanoOS ISO release feed

on:
  repository_dispatch:
    types: [nanoos.iso.published]

permissions:
  contents: write

concurrency:
  group: nanoos-iso-release-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release and update separate ISO feed
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload || {};
            const expectedRepo = "falconediz911-stack/NanoOS-Beta21-ISO";

            if (p.source_repo !== expectedRepo) {
              core.setFailed("Rejected ISO metadata from an unregistered source repository.");
              return;
            }
            if (typeof p.release_tag !== "string" || !p.release_tag.trim()) {
              core.setFailed("Missing ISO release tag.");
              return;
            }
            if (typeof p.release_url !== "string" ||
                !p.release_url.startsWith("https://github.com/falconediz911-stack/NanoOS-Beta21-ISO/releases/")) {
              core.setFailed("Release URL is not from the registered NanoOS ISO repository.");
              return;
            }
            if (!Array.isArray(p.assets) || p.assets.length === 0) {
              core.setFailed("Published ISO release has no attached assets.");
              return;
            }

            const assets = p.assets.map((asset) => {
              if (typeof asset.name !== "string" ||
                  typeof asset.browser_download_url !== "string" ||
                  !asset.browser_download_url.startsWith("https://github.com/falconediz911-stack/NanoOS-Beta21-ISO/releases/download/")) {
                throw new Error("An ISO release asset has an unexpected name or URL.");
              }
              return {
                name: asset.name,
                url: asset.browser_download_url,
                size: Number(asset.size || 0)
              };
            });

            const hasIso = assets.some((asset) => /\.iso($|\.part-[0-9]+$)/i.test(asset.name));
            if (!hasIso) {
              core.setFailed("Release assets do not include an ISO or a split ISO part.");
              return;
            }

            const feed = {
              schema_version: 1,
              product: "NanoOS",
              content_type: "iso",
              channel: p.prerelease ? "testing" : "stable",
              version: p.release_tag,
              release_name: p.release_name || p.release_tag,
              release_url: p.release_url,
              published_at: p.published_at || new Date().toISOString(),
              assets,
              summary: "A new NanoOS ISO release is available. Verify the published checksum before using the image."
            };

            const path = "public/releases/iso-latest.json";
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `release: update ISO feed to ${feed.version}`,
              content: Buffer.from(JSON.stringify(feed, null, 2) + "\n").toString("base64"),
              sha: existingSha,
              branch: "main"
            });

            core.notice(`Updated ${path} for ${feed.version} (${feed.channel}).`);
